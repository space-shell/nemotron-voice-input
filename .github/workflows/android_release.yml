name: Build Android App

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # ubuntu-latest no longer ships a usable Android SDK; install
    # command-line tools ourselves and pin every component.
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ~/android-sdk
        key: android-sdk-35-bt35-ndk28.0.13004108

    - name: Install Android command-line tools
      run: |
        if [ ! -d "$HOME/android-sdk/cmdline-tools/latest" ]; then
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
        fi
        echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

    - name: Install Android SDK components
      run: |
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # transcribe-cpp-sys compiles its C++ core (whisper.cpp/ggml) via CMake.
    # ubuntu-latest ships cmake/ninja, but install explicitly to be safe.
    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # The ~700 MB bundled GGUF is checksum-verified on download; cache it
    # keyed on the checksum list so CI only re-downloads when the model
    # changes.
    - name: Cache model assets
      uses: actions/cache@v4
      with:
        path: model_assets/src/main/assets
        key: model-assets-${{ hashFiles('app/build.gradle.kts') }}

    # Branch pushes only validate the build (no signing secrets needed).
    # Tag pushes build the signed release artifacts.
    - name: Build Debug (branch validation)
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: ./gradlew assembleDebug

    - name: Check signing secrets
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Signed releases need the KEYSTORE_BASE64, KEY_ALIAS, KEY_PASS and STORE_PASS repository secrets (base64 of release.keystore)."
          exit 1
        fi

    - name: Decode Keystore
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

    - name: Build Release APK
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: ./gradlew assembleRelease

    - name: Build Release AAB
      if: startsWith(github.ref, 'refs/tags/')
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: ./gradlew bundleRelease

    - name: Extract Version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oP '[0-9]+')
        echo "Detected Version: $VERSION_NAME (code $VERSION_CODE)"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: Prepare release notes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
        if [ -f "$CHANGELOG" ]; then
          cp "$CHANGELOG" release_notes.md
        else
          echo "Release v${VERSION_NAME}" > release_notes.md
        fi

    - name: Rename Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cp app/build/outputs/apk/release/app-release.apk nemotron_voice_input_v${VERSION_NAME}.apk
        cp app/build/outputs/bundle/release/app-release.aab nemotron_voice_input_v${VERSION_NAME}.aab

    - name: Upload APK Artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: nemotron_voice_input_v${{ env.VERSION_NAME }}-apk
        path: nemotron_voice_input_v${VERSION_NAME}.apk

    - name: Upload AAB Artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: nemotron_voice_input_v${{ env.VERSION_NAME }}-aab
        path: nemotron_voice_input_v${VERSION_NAME}.aab

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ env.VERSION_NAME }}
        body_path: release_notes.md
        files: |
          nemotron_voice_input_v${VERSION_NAME}.apk
          nemotron_voice_input_v${VERSION_NAME}.aab
